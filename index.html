<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RUN!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #111;
      --cream: #FCF9F0;
      --mint: #C8E6D4;
      --shadow: 5px 5px 0 0 var(--black);
      --shadow-sm: 3px 3px 0 0 var(--black);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", system-ui, sans-serif;
      color: var(--black);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background:
        radial-gradient(ellipse 90% 70% at 15% 85%, #b8dcc8 0%, transparent 55%),
        radial-gradient(ellipse 80% 60% at 85% 15%, #dceee3 0%, transparent 50%),
        radial-gradient(ellipse 60% 50% at 50% 50%, #f0ebe0 0%, transparent 70%),
        linear-gradient(155deg, #c5e3d1 0%, #f5f0e4 50%, #fcf9f0 100%);
    }

    html[data-orient="90"] body,
    html[data-orient="270"] body {
      padding: 0.75rem;
    }

    .app {
      width: 100%;
      max-width: 380px;
    }

    html[data-orient="90"] .app,
    html[data-orient="270"] .app {
      max-width: none;
    }

    .card {
      background: var(--cream);
      border: 3px solid var(--black);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.25rem;
    }

    .panel {
      display: none;
      flex-direction: column;
      gap: 1rem;
    }

    .panel.active {
      display: flex;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 0.6rem;
    }

    .card-text {
      font-size: 0.9rem;
      font-weight: 400;
      line-height: 1.55;
      color: #333;
    }

    .btn {
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.7rem 1.25rem;
      border: 3px solid var(--black);
      border-radius: var(--radius);
      background: var(--cream);
      color: var(--black);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.08s, box-shadow 0.08s;
    }

    .btn:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 0 var(--black);
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-full {
      width: 100%;
      text-align: center;
    }

    .camera-intro {
      font-size: 0.8rem;
      font-weight: 400;
      line-height: 1.5;
      color: #333;
      text-align: left;
      padding: 0.65rem 0.75rem;
      border: 2px solid var(--black);
      border-radius: 6px;
      background: var(--cream);
      box-shadow: 2px 2px 0 0 var(--black);
    }

    .camera-toolbar {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 0.45rem;
      min-height: 2.4rem;
    }

    /* Viewfinder */
    .viewfinder-wrap {
      border: 3px solid var(--black);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      background: #222;
      position: relative;
    }

    .viewfinder {
      aspect-ratio: 3 / 4;
      overflow: hidden;
      position: relative;
      touch-action: manipulation;
    }

    html[data-orient="90"] .viewfinder,
    html[data-orient="270"] .viewfinder {
      aspect-ratio: 4 / 3;
    }

    .focus-ring {
      position: absolute;
      width: 64px;
      height: 64px;
      margin-left: -32px;
      margin-top: -32px;
      border: 2px solid #fff;
      border-radius: 4px;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45);
      pointer-events: none;
      opacity: 0;
      transform: scale(1.25);
      transition: opacity 0.15s, transform 0.15s;
      z-index: 7;
    }

    .focus-ring.show {
      opacity: 1;
      transform: scale(1);
    }

    .viewfinder video,
    .viewfinder img,
    .viewfinder canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .viewfinder video {
      display: none;
    }

    .viewfinder img {
      display: none;
    }

    .viewfinder.captured #livePreview {
      display: none;
    }

    .viewfinder.captured #preview {
      display: block;
    }

    .cat-sticker {
      position: absolute;
      right: 4%;
      bottom: 9%;
      width: 38%;
      height: auto;
      display: none;
      pointer-events: none;
      z-index: 5;
    }

    .viewfinder.captured.show-cat .cat-sticker {
      display: block;
    }

    .viewfinder-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--black);
      color: var(--cream);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.3rem 0.6rem;
      text-align: center;
      letter-spacing: 0.04em;
    }

    /* Filters */
    .filter-row {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      flex: 1 1 calc(25% - 0.3rem);
      font-family: inherit;
      font-size: 0.65rem;
      font-weight: 600;
      padding: 0.4rem 0.25rem;
      border: 2px solid var(--black);
      border-radius: 6px;
      background: var(--cream);
      color: var(--black);
      cursor: pointer;
      box-shadow: 2px 2px 0 0 var(--black);
    }

    .filter-btn.active {
      background: var(--black);
      color: var(--cream);
    }

    .filter-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 0 var(--black);
    }

    /* Camera controls */
    .camera-stage {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .stage-main {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      min-width: 0;
    }

    .stage-side {
      display: contents;
    }

    html[data-orient="90"] .camera-stage,
    html[data-orient="270"] .camera-stage {
      flex-direction: row;
      align-items: stretch;
      gap: 0.65rem;
    }

    html[data-orient="90"] .stage-main,
    html[data-orient="270"] .stage-main {
      flex: 1;
    }

    html[data-orient="90"] .stage-side,
    html[data-orient="270"] .stage-side {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding-right: 0.15rem;
      flex-shrink: 0;
      min-width: 8.5rem;
    }

    html[data-orient="90"] .shutter-area,
    html[data-orient="270"] .shutter-area {
      padding: 0;
      flex-wrap: wrap;
      max-width: 8.5rem;
    }

    .camera-controls {
      display: contents;
    }

    .shutter-area {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 0.25rem 0;
    }

    .shutter {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 3px solid var(--black);
      background: #ffb4b4;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      touch-action: none;
      padding: 0;
    }

    .shutter:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 0 var(--black);
    }

    .shutter:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .shutter.recording {
      background: #ff5a5a;
      animation: pulse-rec 0.75s ease-in-out infinite;
    }

    .btn-retake {
      display: none;
      font-size: 0.8rem;
      padding: 0.65rem 1.1rem;
      white-space: nowrap;
    }

    #screen-camera.captured .shutter {
      display: none;
    }

    #screen-camera.captured .btn-retake {
      display: block;
    }

    /* Icon buttons (viewfinder toolbar) */
    .icon-btn {
      border: 2px solid var(--black);
      border-radius: 6px;
      background: var(--cream);
      box-shadow: 2px 2px 0 0 var(--black);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.4rem;
      flex-shrink: 0;
      transition: transform 0.08s, box-shadow 0.08s;
    }

    .icon-btn svg {
      width: 22px;
      height: 22px;
    }

    .icon-btn:active:not(:disabled) {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 0 var(--black);
    }

    .icon-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .icon-btn.active {
      background: var(--black);
    }

    .icon-btn.active svg path,
    .icon-btn.active svg rect {
      stroke: var(--cream);
    }

    .icon-btn.recording {
      background: #ff5a5a;
      animation: pulse-rec 0.75s ease-in-out infinite;
    }

    .icon-btn.recording svg path,
    .icon-btn.recording svg rect {
      stroke: var(--cream);
    }

    @keyframes pulse-rec {
      50% { opacity: 0.6; }
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: var(--cream);
      color: var(--black);
      padding: 0.6rem 1.1rem;
      font-size: 0.8rem;
      font-weight: 600;
      border: 3px solid var(--black);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 200;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
    }

    .hidden-canvas {
      display: none;
    }
  </style>
</head>
<body>

  <div class="app">
    <div class="panel active" id="screen-camera">
      <p class="camera-intro">Registre momentos com esses efeitos meia boca, salve suas fotos e poste onde vc quiser (ou deixa guardado para o esquecimento...)</p>

      <div class="camera-stage">
        <div class="stage-main">
          <div class="viewfinder-wrap" id="viewfinderWrap">
            <div class="viewfinder" id="viewfinder">
              <video id="video" autoplay playsinline muted></video>
              <canvas id="livePreview" aria-hidden="true"></canvas>
              <img id="preview" alt="Foto capturada">
              <img id="catSticker" class="cat-sticker" src="gato.png" alt="" aria-hidden="true">
              <div class="focus-ring" id="focusRing" aria-hidden="true"></div>
              <div class="viewfinder-label" id="viewfinderLabel">Ao vivo</div>
            </div>
          </div>

          <div class="filter-row">
            <button class="filter-btn active" data-filter="bw">P&amp;B</button>
            <button class="filter-btn" data-filter="bwhc">P&amp;B+</button>
            <button class="filter-btn" data-filter="matte">Matte</button>
            <button class="filter-btn" data-filter="color">Color</button>
            <button class="filter-btn" data-filter="teal">Teal</button>
            <button class="filter-btn" data-filter="neon">Neon</button>
            <button class="filter-btn" data-filter="ka3">KA3</button>
            <button class="filter-btn" data-filter="kg2">KG2</button>
            <button class="filter-btn" data-filter="kc25">KC25</button>
            <button class="filter-btn" data-filter="focus">Foco</button>
            <button class="filter-btn" data-filter="pixel">Pixel</button>
          </div>
        </div>

        <div class="stage-side">
          <div class="shutter-area">
            <button class="icon-btn" id="btnFlip" aria-label="Virar câmera">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M7 4v4H3" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M3 8c1.6-3.2 5.1-5.2 9-5.2 3.5 0 6.6 1.7 8.4 4.4" stroke="#111" stroke-width="2.2" stroke-linecap="round"/>
                <path d="M17 20v-4h4" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M21 16c-1.6 3.2-5.1 5.2-9 5.2-3.5 0-6.6-1.7-8.4-4.4" stroke="#111" stroke-width="2.2" stroke-linecap="round"/>
              </svg>
            </button>
            <button class="shutter" id="btnCapture" type="button" aria-label="Capturar"></button>
            <button class="btn btn-retake" id="btnRetake">Tirar outra</button>
            <button class="icon-btn" id="btnSave" disabled aria-label="Salvar">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M12 3v12m0 0l4-4m-4 4L8 11" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <canvas class="hidden-canvas" id="canvas"></canvas>
  <canvas class="hidden-canvas" id="rawCanvas"></canvas>

  <script>
    const btnCapture = document.getElementById("btnCapture");
    const btnRetake = document.getElementById("btnRetake");
    const btnFlip = document.getElementById("btnFlip");
    const btnSave = document.getElementById("btnSave");
    const screenCamera = document.getElementById("screen-camera");

    const viewfinderWrap = document.getElementById("viewfinderWrap");
    const viewfinder = document.getElementById("viewfinder");
    const viewfinderLabel = document.getElementById("viewfinderLabel");
    const video = document.getElementById("video");
    const livePreview = document.getElementById("livePreview");
    const livePreviewCtx = livePreview.getContext("2d");
    const preview = document.getElementById("preview");
    const canvas = document.getElementById("canvas");
    const rawCanvas = document.getElementById("rawCanvas");
    const toast = document.getElementById("toast");
    const focusRing = document.getElementById("focusRing");
    const filterBtns = document.querySelectorAll(".filter-btn");

    let stream = null;
    let videoTrack = null;
    let orientationAngle = 0;
    let capturedOrientation = 0;
    let focusRingTimer = null;
    let exposureBias = 0;
    let sampleCanvas = null;
    let capturedDataUrl = null;
    let currentFilter = "bw";
    let facingMode = "environment";
    let capturedIsGif = false;
    let capturedBlobUrl = null;
    let isRecordingGif = false;
    let shutterHoldTimer = null;
    let shutterHoldActive = false;
    const HOLD_TO_GIF_MS = 300;
    let gifFrames = [];
    let gifRecordTimer = null;
    let gifencModule = null;
    let gifOrientation = 0;
    let livePreviewRaf = null;
    let lastLiveFrame = 0;
    const LIVE_FPS = 12;
    const LIVE_PREVIEW_MAX = 480;
    const CAPTURE_MAX = 960;
    const SAVE_WIDTH = 1080;
    const SAVE_HEIGHT = 1440;
    const SAVE_DPI = 150;
    const SAVE_JPEG_QUALITY = 0.92;
    const CAMERA_KEY = "run_camera_ok";
    let catAlreadyShown = false;
    let showCatOnCapture = false;

    const catOverlay = new Image();
    catOverlay.src = "gato.png";
    let catOverlayReady = false;

    catOverlay.onload = () => { catOverlayReady = true; };
    catOverlay.onerror = () => { catOverlayReady = false; };
    if (catOverlay.complete && catOverlay.naturalWidth) catOverlayReady = true;

    function revokeCapturedUrl() {
      if (capturedBlobUrl) {
        URL.revokeObjectURL(capturedBlobUrl);
        capturedBlobUrl = null;
      }
    }

    function shouldShowCatThisSession() {
      return !catAlreadyShown;
    }

    function hideCatSticker() {
      showCatOnCapture = false;
      viewfinder.classList.remove("show-cat");
    }

    function drawCatOverlay(ctx, w, h) {
      if (!catOverlayReady || !catOverlay.naturalWidth) return;

      const maxW = w * 0.4;
      const scale = maxW / catOverlay.width;
      const drawW = catOverlay.width * scale;
      const drawH = catOverlay.height * scale;
      const pad = w * 0.035;
      const x = w - drawW - pad;
      const y = h - drawH - pad;

      ctx.drawImage(catOverlay, x, y, drawW, drawH);
    }

    function updateCaptureModeUI() {
      if (!viewfinder.classList.contains("captured") && !isRecordingGif) {
        viewfinderLabel.textContent = "Ao vivo";
      }
    }

    function saveCameraPermission() {
      try { localStorage.setItem(CAMERA_KEY, "1"); } catch {}
    }

    function clearCameraPermission() {
      try { localStorage.removeItem(CAMERA_KEY); } catch {}
    }

    async function syncCameraPermission() {
      if (!navigator.permissions?.query) return;
      try {
        const status = await navigator.permissions.query({ name: "camera" });
        if (status.state === "granted") saveCameraPermission();
        if (status.state === "denied") clearCameraPermission();
        status.onchange = () => {
          if (status.state === "granted") saveCameraPermission();
          if (status.state === "denied") clearCameraPermission();
        };
      } catch {}
    }

    async function requestCameraStream() {
      return navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: facingMode },
          focusMode: { ideal: "continuous" },
          exposureMode: { ideal: "continuous" }
        },
        audio: false
      });
    }

    function getOrientationAngle() {
      if (screen.orientation?.angle != null) return screen.orientation.angle;
      if (typeof window.orientation === "number") {
        const o = window.orientation;
        return o < 0 ? o + 360 : o;
      }
      return window.innerWidth > window.innerHeight ? 90 : 0;
    }

    function isLandscapeOrientation(angle = orientationAngle) {
      return angle === 90 || angle === 270;
    }

    function updateOrientationUI() {
      orientationAngle = getOrientationAngle();
      document.documentElement.dataset.orient = String(orientationAngle);
      if (!viewfinder.classList.contains("captured")) {
        renderLivePreview();
      }
    }

    function getVideoTrack() {
      return stream?.getVideoTracks?.()[0] || videoTrack || null;
    }

    function getViewfinderVideoCrop(source, angle = orientationAngle) {
      const vw = source.videoWidth;
      const vh = source.videoHeight;
      if (!vw || !vh) return null;

      const portrait = !isLandscapeOrientation(angle);
      const targetRatio = portrait ? 3 / 4 : 4 / 3;
      const sourceRatio = vw / vh;

      if (sourceRatio > targetRatio) {
        const sh = vh;
        const sw = Math.round(vh * targetRatio);
        return { sx: Math.round((vw - sw) / 2), sy: 0, sw, sh };
      }

      const sw = vw;
      const sh = Math.round(vw / targetRatio);
      return { sx: 0, sy: Math.round((vh - sh) / 2), sw, sh };
    }

    function sampleTapBrightness(normX, normY) {
      captureViewfinderFrame(video);
      const w = rawCanvas.width;
      const h = rawCanvas.height;
      if (!w || !h) return 0.5;

      const cx = normX * w;
      const cy = normY * h;
      const patch = Math.max(12, Math.min(w, h) * 0.12);

      if (!sampleCanvas) sampleCanvas = document.createElement("canvas");
      const size = 8;
      sampleCanvas.width = size;
      sampleCanvas.height = size;
      const ctx = sampleCanvas.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(
        rawCanvas,
        cx - patch / 2,
        cy - patch / 2,
        patch,
        patch,
        0,
        0,
        size,
        size
      );

      const data = ctx.getImageData(0, 0, size, size).data;
      let sum = 0;
      for (let i = 0; i < data.length; i += 4) {
        sum += data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
      }
      return (sum / (data.length / 4)) / 255;
    }

    function clampExposureBias(value) {
      return Math.max(-1.5, Math.min(1.5, value));
    }

    function computeExposureBias(brightness) {
      const target = 0.4;
      return clampExposureBias((target - brightness) * 1.9);
    }

    function applyExposureBias(ctx, w, h) {
      if (!exposureBias) return;

      const imgData = ctx.getImageData(0, 0, w, h);
      const px = imgData.data;
      const mult = Math.pow(2, exposureBias * 0.62);
      const offset = exposureBias * 8;

      for (let i = 0; i < px.length; i += 4) {
        px[i]     = Math.max(0, Math.min(255, px[i] * mult + offset));
        px[i + 1] = Math.max(0, Math.min(255, px[i + 1] * mult + offset));
        px[i + 2] = Math.max(0, Math.min(255, px[i + 2] * mult + offset));
      }

      ctx.putImageData(imgData, 0, 0);
    }

    function showFocusRing(clientX, clientY) {
      const rect = viewfinder.getBoundingClientRect();
      const x = clientX - rect.left;
      const y = clientY - rect.top;
      if (x < 0 || y < 0 || x > rect.width || y > rect.height) return;

      focusRing.style.left = `${x}px`;
      focusRing.style.top = `${y}px`;
      focusRing.classList.add("show");
      clearTimeout(focusRingTimer);
      focusRingTimer = setTimeout(() => focusRing.classList.remove("show"), 1200);
    }

    async function focusAtPoint(clientX, clientY) {
      const track = getVideoTrack();
      if (!track || viewfinder.classList.contains("captured")) return;

      const rect = viewfinder.getBoundingClientRect();
      let x = (clientX - rect.left) / rect.width;
      let y = (clientY - rect.top) / rect.height;
      if (isFrontCamera()) x = 1 - x;
      x = Math.max(0.05, Math.min(0.95, x));
      y = Math.max(0.05, Math.min(0.95, y));

      showFocusRing(clientX, clientY);

      const brightness = sampleTapBrightness(x, y);
      exposureBias = computeExposureBias(brightness);

      const point = { x, y };
      const attempts = [
        {
          advanced: [{
            pointsOfInterest: [point],
            focusMode: "single-shot",
            exposureMode: "single-shot"
          }]
        },
        {
          advanced: [{
            pointsOfInterest: [point],
            exposureMode: "single-shot"
          }]
        },
        {
          advanced: [{
            pointsOfInterest: [point],
            focusMode: "single-shot"
          }]
        },
        { advanced: [{ pointsOfInterest: [point] }] },
        { focusMode: "single-shot" },
        { advanced: [{ focusMode: "continuous" }] }
      ];

      for (const constraint of attempts) {
        try {
          await track.applyConstraints(constraint);
          if (!viewfinder.classList.contains("captured")) renderLivePreview();
          return;
        } catch {}
      }

      if (!viewfinder.classList.contains("captured")) renderLivePreview();
    }

    function drawSourceCrop(ctx, source, sx, sy, sw, sh, outW, outH, mirror) {
      if (mirror) {
        ctx.translate(outW, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(source, sx, sy, sw, sh, 0, 0, outW, outH);
    }

    function captureViewfinderFrame(source, angle = orientationAngle) {
      const crop = getViewfinderVideoCrop(source, angle);
      if (!crop) return;

      const { sx, sy, sw, sh } = crop;
      const mirror = isFrontCamera();
      let outW = sw;
      let outH = sh;

      if (angle === 90 || angle === 270) {
        outW = sh;
        outH = sw;
      }

      rawCanvas.width = outW;
      rawCanvas.height = outH;
      const ctx = rawCanvas.getContext("2d");
      ctx.save();
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, outW, outH);

      if (angle === 0) {
        drawSourceCrop(ctx, source, sx, sy, sw, sh, outW, outH, mirror);
      } else if (angle === 180) {
        ctx.translate(outW, outH);
        ctx.rotate(Math.PI);
        drawSourceCrop(ctx, source, sx, sy, sw, sh, outW, outH, mirror);
      } else if (angle === 90) {
        ctx.translate(outW, 0);
        ctx.rotate(Math.PI / 2);
        drawSourceCrop(ctx, source, sx, sy, sw, sh, sh, sw, mirror);
      } else if (angle === 270) {
        ctx.translate(0, outH);
        ctx.rotate(-Math.PI / 2);
        drawSourceCrop(ctx, source, sx, sy, sw, sh, sh, sw, mirror);
      }

      ctx.restore();
    }

    function showToast(msg) {

    function setCaptureUI(captured) {

      btnRetake.disabled = !captured;

    function captureFilteredFrame(maxDim) {
      captureViewfinderFrame(video, gifOrientation || orientationAngle);

      let w = rawCanvas.width;
      let h = rawCanvas.height;
      if (Math.max(w, h) > maxDim) {
        const scale = maxDim / Math.max(w, h);
        w = Math.round(w * scale);
        h = Math.round(h * scale);
      }

      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(rawCanvas, 0, 0, w, h);
      applyExposureBias(ctx, w, h);
      applyFilter(ctx, w, h);
      return ctx.getImageData(0, 0, w, h);
    }

    async function loadGifenc() {
      if (!gifencModule) {
        gifencModule = await import("https://cdn.jsdelivr.net/npm/gifenc@1.0.3/+esm");
      }
      return gifencModule;
    }

    async function encodeGif(frames, w, h, delay = 125) {
      const { GIFEncoder, quantize, applyPalette } = await loadGifenc();
      const enc = GIFEncoder();

      for (const frame of frames) {
        const palette = quantize(frame.data, 256);
        const index = applyPalette(frame.data, palette);
        enc.writeFrame(index, w, h, { palette, delay });
      }

      enc.finish();
      return new Blob([enc.bytes()], { type: "image/gif" });
    }

    function startRecordingGif() {
      if (!stream || isRecordingGif) return;

      isRecordingGif = true;
      gifFrames = [];
      gifOrientation = orientationAngle;
      btnCapture.classList.add("recording");
      btnFlip.disabled = true;
      viewfinderLabel.textContent = "Gravando...";

      const GIF_FPS = 8;
      const GIF_MAX_SEC = 4;
      const GIF_MAX = 320;

      const captureFrame = () => {
        if (!stream || !isRecordingGif) return;
        gifFrames.push(captureFilteredFrame(GIF_MAX));
        if (gifFrames.length >= GIF_FPS * GIF_MAX_SEC) {
          stopRecordingGif(true);
        }
      };

      captureFrame();
      gifRecordTimer = setInterval(captureFrame, 1000 / GIF_FPS);
    }

    async function stopRecordingGif(save = true) {
      if (gifRecordTimer) {
        clearInterval(gifRecordTimer);
        gifRecordTimer = null;
      }

      if (!isRecordingGif) return;

      isRecordingGif = false;
      btnCapture.classList.remove("recording");
      btnFlip.disabled = false;

      if (!save || gifFrames.length < 2) {
        const tooShort = save && gifFrames.length < 2;
        gifFrames = [];
        updateCaptureModeUI();
        if (tooShort) {
          viewfinderLabel.textContent = "Ao vivo";
          showToast("Segure um pouco mais");
        }
        return;
      }

      viewfinderLabel.textContent = "Processando...";

      try {
        const w = gifFrames[0].width;
        const h = gifFrames[0].height;
        const blob = await encodeGif(gifFrames, w, h);
        revokeCapturedUrl();
        capturedBlobUrl = URL.createObjectURL(blob);
        capturedDataUrl = capturedBlobUrl;
        capturedIsGif = true;
        preview.src = capturedDataUrl;
        updateCaptureModeUI();
        setCaptureUI(true);
        viewfinderLabel.textContent = "GIF";
        stopCamera();
        showToast("GIF pronto!");
      } catch {
        showToast("Erro ao criar GIF");
        updateCaptureModeUI();
      }

      gifFrames = [];
    }

      captureViewfinderFrame(video);

      let w = rawCanvas.width;
      let h = rawCanvas.height;
      if (Math.max(w, h) > LIVE_PREVIEW_MAX) {
        const scale = LIVE_PREVIEW_MAX / Math.max(w, h);
        w = Math.round(w * scale);
        h = Math.round(h * scale);
      }

      if (livePreview.width !== w || livePreview.height !== h) {
        livePreview.width = w;
        livePreview.height = h;

    function livePreviewLoop(ts) {
      if (!stream || viewfinder.classList.contains("captured")) {
        livePreviewRaf = null;
        return;
      }

      if (!lastLiveFrame || ts - lastLiveFrame >= 1000 / LIVE_FPS) {
        renderLivePreview();
        lastLiveFrame = ts;
      }

      livePreviewRaf = requestAnimationFrame(livePreviewLoop);
    }

    function startLivePreview() {

    async function startCamera() {
      try {

    function applyBwEffect(ctx, w, h) {
      const imgData = ctx.getImageData(0, 0, w, h);
      const px = imgData.data;
      const cx = w / 2;
      const cy = h / 2;
      const maxDist = Math.sqrt(cx * cx + cy * cy);
      const total = w * h;

      const grainLayer = new Float32Array(total);
      for (let n = 0; n < total; n++) {
        grainLayer[n] = (Math.random() - 0.5) * 2;
      }

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const idx = y * w + x;
          const i = idx * 4;

          let lum = px[i] * 0.299 + px[i + 1] * 0.587 + px[i + 2] * 0.114;

          lum = lum / 255;
          lum = lum < 0.5
            ? 2 * lum * lum
            : 1 - Math.pow(-2 * lum + 2, 2) / 2;
          lum = Math.pow(lum, 0.78) * 255;
          lum = lum * 0.94 + 6;

          const dx = x - cx;
          const dy = y - cy;
          const dist = Math.sqrt(dx * dx + dy * dy) / maxDist;
          lum *= 1 - Math.pow(dist, 2.2) * 0.32;

          const prev = idx > 0 ? grainLayer[idx - 1] : grainLayer[idx];
          const next = idx < total - 1 ? grainLayer[idx + 1] : grainLayer[idx];
          const clump = grainLayer[idx] * 0.5 + prev * 0.25 + next * 0.25;

          const midWeight = 1 - Math.abs(lum / 255 - 0.5) * 1.4;
          const grain = clump * 13 * Math.max(0.35, midWeight);
          const fine = (Math.random() - 0.5) * 6 * Math.max(0.4, midWeight);

          lum += grain + fine;
          lum = Math.max(0, Math.min(255, lum));

          const v = Math.round(lum);
          px[i] = v;
          px[i + 1] = v;
          px[i + 2] = v;
        }
      }

      ctx.putImageData(imgData, 0, 0);
    }

          b -= 5 * warmMid;

          r = 255 * Math.pow(Math.max(0, r) / 255, 0.9);
          g = 255 * Math.pow(Math.max(0, g) / 255, 0.93);
          b = 255 * Math.pow(Math.max(0, b) / 255, 0.91);

          const dx = x - cx;
          const dy = y - cy;
          const dist = Math.sqrt(dx * dx + dy * dy) / maxDist;
          const vignette = 1 - Math.pow(dist, 2) * 0.16;
          r *= vignette;
          g *= vignette;
          b *= vignette;

          const avgLum = (r + g + b) / 3;
          const midWeight = 1 - Math.abs(avgLum / 255 - 0.5) * 1.1;
          const prev = idx > 0 ? grainLayer[idx - 1] : grainLayer[idx];
          const next = idx < total - 1 ? grainLayer[idx + 1] : grainLayer[idx];
          const clump = grainLayer[idx] * 0.5 + prev * 0.25 + next * 0.25;
          const grain = clump * 5 * Math.max(0.4, midWeight);
          const fine = (Math.random() - 0.5) * 3 * Math.max(0.5, midWeight);

          r += grain + fine;
          g += grain * 0.97 + fine * 0.96;
          b += grain * 0.94 + fine * 0.93;

          px[i]     = Math.max(0, Math.min(255, r));
          px[i + 1] = Math.max(0, Math.min(255, g));
          px[i + 2] = Math.max(0, Math.min(255, b));
        }
      }

      ctx.putImageData(imgData, 0, 0);
    }

    function applyKg2Effect(ctx, w, h) {
      const imgData = ctx.getImageData(0, 0, w, h);
      const px = imgData.data;
      const cx = w / 2;
      const cy = h / 2;
      const maxDist = Math.sqrt(cx * cx + cy * cy);
      const total = w * h;

      const grainLayer = new Float32Array(total);
      for (let n = 0; n < total; n++) {
        grainLayer[n] = (Math.random() - 0.5) * 2;
      }

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const idx = y * w + x;
          const i = idx * 4;
          let r = px[i];
          let g = px[i + 1];
          let b = px[i + 2];

          const lum = (r * 0.299 + g * 0.587 + b * 0.114) / 255;
          const shadowLift = Math.pow(1 - lum, 1.6) * 18;

          r = ((r / 255 - 0.5) * 1.1 + 0.5) * 255 + shadowLift;
          g = ((g / 255 - 0.5) * 1.08 + 0.5) * 255 + shadowLift * 0.92;
          b = ((b / 255 - 0.5) * 1.06 + 0.5) * 255 + shadowLift * 0.75;

          const gray = r * 0.299 + g * 0.587 + b * 0.114;
          const sat = 1.3;
          r = r * sat + gray * (1 - sat);
          g = g * sat + gray * (1 - sat);
          b = b * sat + gray * (1 - sat);

          r = r * 1.06 + 12;
          g = g * 1.02 + 8;
          b = b * 0.94 + 4;

          const gold = Math.max(0, 1 - Math.abs(lum - 0.5) * 1.8);
          r += 16 * gold;
          g += 10 * gold;
          b -= 8 * gold;

          const highlight = Math.pow(lum, 1.4);
          r += highlight * 8;
          g += highlight * 5;
          b -= highlight * 4;

          r = 255 * Math.pow(Math.max(0, r) / 255, 0.96);
          g = 255 * Math.pow(Math.max(0, g) / 255, 0.97);
          b = 255 * Math.pow(Math.max(0, b) / 255, 0.98);

          const dx = x - cx;
          const dy = y - cy;
          const dist = Math.sqrt(dx * dx + dy * dy) / maxDist;
          const vignette = 1 - Math.pow(dist, 2) * 0.14;
          r *= vignette;
          g *= vignette;
          b *= vignette;

          const avgLum = (r + g + b) / 3;
          const midWeight = 1 - Math.abs(avgLum / 255 - 0.5) * 1.15;
          const prev = idx > 0 ? grainLayer[idx - 1] : grainLayer[idx];
          const next = idx < total - 1 ? grainLayer[idx + 1] : grainLayer[idx];
          const clump = grainLayer[idx] * 0.5 + prev * 0.25 + next * 0.25;
          const grain = clump * 6 * Math.max(0.35, midWeight);
          const fine = (Math.random() - 0.5) * 3.5 * Math.max(0.45, midWeight);

          r += grain + fine;
          g += grain * 0.98 + fine * 0.97;
          b += grain * 0.94 + fine * 0.92;

          px[i]     = Math.max(0, Math.min(255, r));
          px[i + 1] = Math.max(0, Math.min(255, g));
          px[i + 2] = Math.max(0, Math.min(255, b));
        }
      }

      ctx.putImageData(imgData, 0, 0);
    }

    function applyKc25Effect(ctx, w, h) {
      const imgData = ctx.getImageData(0, 0, w, h);
      const px = imgData.data;
      const cx = w / 2;
      const cy = h / 2;
      const maxDist = Math.sqrt(cx * cx + cy * cy);
      const total = w * h;

      const grainLayer = new Float32Array(total);
      for (let n = 0; n < total; n++) {
        grainLayer[n] = (Math.random() - 0.5) * 2;
      }

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const idx = y * w + x;
          const i = idx * 4;
          let r = px[i];
          let g = px[i + 1];
          let b = px[i + 2];

          const lum = (r * 0.299 + g * 0.587 + b * 0.114) / 255;
          const shadowLift = Math.pow(1 - lum, 1.8) * 14;

          r = ((r / 255 - 0.5) * 1.14 + 0.5) * 255 + shadowLift;
          g = ((g / 255 - 0.5) * 1.12 + 0.5) * 255 + shadowLift * 0.9;
          b = ((b / 255 - 0.5) * 1.15 + 0.5) * 255 + shadowLift * 0.85;

          const gray = r * 0.299 + g * 0.587 + b * 0.114;
          const sat = 1.38;
          r = r * sat + gray * (1 - sat);
          g = g * sat + gray * (1 - sat);
          b = b * sat + gray * (1 - sat);

          const redBias = Math.max(0, r - Math.max(g, b) * 0.9);
          r += redBias * 0.14;

          const blueBias = Math.max(0, b - Math.max(r, g) * 0.88);
          b += blueBias * 0.12;
          g += blueBias * 0.04;

          const warmMid = Math.max(0, 1 - Math.abs(lum - 0.48) * 2.0);
          r += 10 * warmMid;
          g += 5 * warmMid;
          b -= 3 * warmMid;

          const n = lum;
          const smooth = n < 0.5
            ? 2 * n * n
            : 1 - Math.pow(-2 * n + 2, 2) / 2;
          const blended = n * 0.25 + smooth * 0.75;
          const tone = Math.pow(blended, 0.94);
          r = r * (0.7 + tone * 0.55);
          g = g * (0.72 + tone * 0.52);
          b = b * (0.74 + tone * 0.5);

          const dx = x - cx;
          const dy = y - cy;
          const dist = Math.sqrt(dx * dx + dy * dy) / maxDist;
          const vignette = 1 - Math.pow(dist, 2) * 0.15;
          r *= vignette;
          g *= vignette;
          b *= vignette;

          const avgLum = (r + g + b) / 3;
          const midWeight = 1 - Math.abs(avgLum / 255 - 0.5) * 1.1;
          const prev = idx > 0 ? grainLayer[idx - 1] : grainLayer[idx];
          const next = idx < total - 1 ? grainLayer[idx + 1] : grainLayer[idx];
          const clump = grainLayer[idx] * 0.5 + prev * 0.25 + next * 0.25;
          const grain = clump * 4.5 * Math.max(0.4, midWeight);
          const fine = (Math.random() - 0.5) * 2.8 * Math.max(0.5, midWeight);

          r += grain + fine;
          g += grain * 0.98 + fine * 0.97;
          b += grain * 0.96 + fine * 0.95;

          px[i]     = Math.max(0, Math.min(255, r));
          px[i + 1] = Math.max(0, Math.min(255, g));
          px[i + 2] = Math.max(0, Math.min(255, b));
        }
      }

      ctx.putImageData(imgData, 0, 0);
    }

    function samplePixel(px, w, h, x, y) {
      x = Math.max(0, Math.min(w - 1.001, x));
      y = Math.max(0, Math.min(h - 1.001, y));
      const x0 = Math.floor(x);
      const y0 = Math.floor(y);
      const x1 = Math.min(x0 + 1, w - 1);
      const y1 = Math.min(y0 + 1, h - 1);
      const fx = x - x0;
      const fy = y - y0;
      const w00 = (1 - fx) * (1 - fy);
      const w10 = fx * (1 - fy);
      const w01 = (1 - fx) * fy;
      const w11 = fx * fy;
      const i00 = (y0 * w + x0) * 4;
      const i10 = (y0 * w + x1) * 4;
      const i01 = (y1 * w + x0) * 4;
      const i11 = (y1 * w + x1) * 4;
      return [
        px[i00] * w00 + px[i10] * w10 + px[i01] * w01 + px[i11] * w11,
        px[i00 + 1] * w00 + px[i10 + 1] * w10 + px[i01 + 1] * w01 + px[i11 + 1] * w11,
        px[i00 + 2] * w00 + px[i10 + 2] * w10 + px[i01 + 2] * w01 + px[i11 + 2] * w11
      ];
    }

    function applyRadialFocusEffect(ctx, w, h) {
      const maxDim = 800;
      let workCtx = ctx;
      let ww = w;
      let wh = h;
      let tempCanvas = null;

      if (Math.max(w, h) > maxDim) {
        const scale = maxDim / Math.max(w, h);
        ww = Math.round(w * scale);
        wh = Math.round(h * scale);
        tempCanvas = document.createElement("canvas");
        tempCanvas.width = ww;
        tempCanvas.height = wh;
        workCtx = tempCanvas.getContext("2d");
        workCtx.drawImage(ctx.canvas, 0, 0, ww, wh);
      }

      const src = workCtx.getImageData(0, 0, ww, wh);
      const dst = workCtx.createImageData(ww, wh);
      const px = src.data;
      const out = dst.data;
      const cx = ww / 2;
      const focusHalfWidth = 0.2;

      for (let y = 0; y < wh; y++) {
        for (let x = 0; x < ww; x++) {
          const i = (y * ww + x) * 4;
          const normDistX = Math.abs(x - cx) / cx;

          let blurAmount = Math.max(0, (normDistX - focusHalfWidth) / (1 - focusHalfWidth));
          blurAmount = blurAmount * blurAmount * 0.85;

          if (blurAmount < 0.02) {
            out[i] = px[i];
            out[i + 1] = px[i + 1];
            out[i + 2] = px[i + 2];
            out[i + 3] = 255;
            continue;
          }

          const samples = Math.floor(8 + blurAmount * 20);
          let r = 0;
          let g = 0;
          let b = 0;
          const spread = blurAmount * cx * 0.38;

          for (let s = 0; s < samples; s++) {
            const t = s / (samples - 1) - 0.5;
            const [sr, sg, sb] = samplePixel(px, ww, wh, x + t * spread * 2, y);
            r += sr;
            g += sg;
            b += sb;
          }

          r = r / samples * 0.96 + 6;
          g = g / samples * 0.96 + 6;
          b = b / samples * 0.96 + 6;

          out[i]     = Math.max(0, Math.min(255, r));
          out[i + 1] = Math.max(0, Math.min(255, g));
          out[i + 2] = Math.max(0, Math.min(255, b));
          out[i + 3] = 255;
        }
      }

      workCtx.putImageData(dst, 0, 0);

      if (tempCanvas) {
        ctx.drawImage(tempCanvas, 0, 0, w, h);
      }
    }

    function applyPixelArtEffect(ctx, w, h) {
      const imgData = ctx.getImageData(0, 0, w, h);
      const px = imgData.data;
      const cx = w / 2;
      const cy = h / 2;
      const maxDist = Math.sqrt(cx * cx + cy * cy);
      const total = w * h;
      const light = [244, 237, 227];
      const dark = [45, 60, 88];

      const grainLayer = new Float32Array(total);
      for (let n = 0; n < total; n++) {
        grainLayer[n] = (Math.random() - 0.5) * 2;
      }

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const idx = y * w + x;
          const i = idx * 4;

          let lum = px[i] * 0.299 + px[i + 1] * 0.587 + px[i + 2] * 0.114;

          lum = lum / 255;
          const linear = lum;
          let curved = lum < 0.5
            ? 2 * lum * lum
            : 1 - Math.pow(-2 * lum + 2, 2) / 2;
          curved = Math.pow(curved, 0.85);
          lum = (linear * 0.3 + curved * 0.7) * 255;
          lum = lum * 0.958 + 4;

          const dx = x - cx;
          const dy = y - cy;
          const dist = Math.sqrt(dx * dx + dy * dy) / maxDist;
          lum *= 1 - Math.pow(dist, 2.2) * 0.22;

          const prev = idx > 0 ? grainLayer[idx - 1] : grainLayer[idx];
          const next = idx < total - 1 ? grainLayer[idx + 1] : grainLayer[idx];
          const clump = grainLayer[idx] * 0.5 + prev * 0.25 + next * 0.25;

          const midWeight = 1 - Math.abs(lum / 255 - 0.5) * 1.4;
          const grain = clump * 13 * Math.max(0.35, midWeight);
          const fine = (Math.random() - 0.5) * 6 * Math.max(0.4, midWeight);

          lum += grain + fine;

          const threshold = ((x + y) % 2 === 0) ? 130 : 110;
          const c = lum > threshold ? light : dark;

          px[i] = c[0];
          px[i + 1] = c[1];
          px[i + 2] = c[2];
        }
      }

      ctx.putImageData(imgData, 0, 0);
    }

    function applyFilter(ctx, w, h) {
      if (currentFilter === "color") {
        applyColorRetroEffect(ctx, w, h);
      } else if (currentFilter === "teal") {
        applyTealOrangeEffect(ctx, w, h);
      } else if (currentFilter === "neon") {
        applyNeonEffect(ctx, w, h);
      } else if (currentFilter === "ka3") {
        applyKa3Effect(ctx, w, h);
      } else if (currentFilter === "kg2") {
        applyKg2Effect(ctx, w, h);
      } else if (currentFilter === "kc25") {
        applyKc25Effect(ctx, w, h);
      } else if (currentFilter === "focus") {
        applyRadialFocusEffect(ctx, w, h);
      } else if (currentFilter === "pixel") {
        applyPixelArtEffect(ctx, w, h);
      } else if (currentFilter === "bwhc") {
        applyBwHighContrastEffect(ctx, w, h);
      } else if (currentFilter === "matte") {
        applyBwMatteEffect(ctx, w, h);
      } else {
        applyBwEffect(ctx, w, h);
      }
    }

    function isFrontCamera() {
      return facingMode === "user";
    }

    function renderCaptured() {
      let w = rawCanvas.width;
      let h = rawCanvas.height;

      if (!w || !h) {
        throw new Error("empty-frame");
      }

      if (Math.max(w, h) > CAPTURE_MAX) {
        const scale = CAPTURE_MAX / Math.max(w, h);
        w = Math.round(w * scale);
        h = Math.round(h * scale);
      }

      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(rawCanvas, 0, 0, w, h);
      applyExposureBias(ctx, w, h);
      applyFilter(ctx, w, h);
      revokeCapturedUrl();
      capturedDataUrl = canvas.toDataURL("image/jpeg", 0.92);
      preview.src = capturedDataUrl;
    }

    function setFilter(filter) {
      currentFilter = filter;
      filterBtns.forEach(btn => {
        btn.classList.toggle("active", btn.dataset.filter === filter);
      });
      if (viewfinder.classList.contains("captured")) {
        renderCaptured();
      } else {
        renderLivePreview();
      }
    }

    function takePhoto() {
      if (!stream) {
        showToast("Câmera não está pronta");
        return;
      }

      if (!video.videoWidth || !video.videoHeight) {
        showToast("Aguarde a câmera carregar");
        return;
      }

      try {
        viewfinderLabel.textContent = "Capturando...";
        capturedOrientation = orientationAngle;
        captureViewfinderFrame(video, capturedOrientation);
        showCatOnCapture = shouldShowCatThisSession();
        renderCaptured();
        if (showCatOnCapture) catAlreadyShown = true;
        capturedIsGif = false;
        setCaptureUI(true);
        viewfinderLabel.textContent = "Capturada";
        stopCamera();
      } catch {
        hideCatSticker();
        setCaptureUI(false);
        viewfinderLabel.textContent = "Ao vivo";
        showToast("Erro ao capturar");
      }
    }

    function retakePhoto() {
      preview.src = "";
      capturedDataUrl = null;
      capturedIsGif = false;
      hideCatSticker();
      revokeCapturedUrl();
      setCaptureUI(false);
      updateCaptureModeUI();
      startCamera();
    }

    function savePhoto() {
      if (!capturedDataUrl) return;

      if (capturedIsGif) {
        downloadDataUrl(capturedDataUrl, "run-foto.gif");
        showToast("GIF salvo!");
        return;
      }

      const img = new Image();
      img.onload = () => {
        try {
          const includeCat = showCatOnCapture && catOverlayReady;
          const url = buildSavePhotoDataUrl(img, includeCat);
          downloadDataUrl(url, "run-foto.jpg");
          showToast("Foto salva!");
        } catch {
          showToast("Erro ao salvar");
        }
      };
      img.onerror = () => showToast("Erro ao salvar");
      img.src = capturedDataUrl;
    }

    function drawCoverImage(ctx, img, outW, outH) {
      const scale = Math.max(outW / img.width, outH / img.height);
      const drawW = img.width * scale;
      const drawH = img.height * scale;
      const x = (outW - drawW) / 2;
      const y = (outH - drawH) / 2;
      ctx.drawImage(img, x, y, drawW, drawH);
    }

    function buildSavePhotoDataUrl(img, includeCat = false) {
      const out = document.createElement("canvas");
      out.width = SAVE_WIDTH;
      out.height = SAVE_HEIGHT;
      const ctx = out.getContext("2d");
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, SAVE_WIDTH, SAVE_HEIGHT);
      drawCoverImage(ctx, img, SAVE_WIDTH, SAVE_HEIGHT);
      if (includeCat) drawCatOverlay(ctx, SAVE_WIDTH, SAVE_HEIGHT);
      return canvasToJpegWithDpi(out, SAVE_DPI, SAVE_JPEG_QUALITY);
    }

    function setJpegDpi(bytes, dpi) {
      for (let i = 0; i < bytes.length - 16; i++) {
        if (
          bytes[i] === 0xFF && bytes[i + 1] === 0xE0 &&
          bytes[i + 4] === 0x4A && bytes[i + 5] === 0x46 &&
          bytes[i + 6] === 0x49 && bytes[i + 7] === 0x46 && bytes[i + 8] === 0x00
        ) {
          bytes[i + 11] = 1;
          bytes[i + 12] = (dpi >> 8) & 0xFF;
          bytes[i + 13] = dpi & 0xFF;
          bytes[i + 14] = (dpi >> 8) & 0xFF;
          bytes[i + 15] = dpi & 0xFF;
          return;
        }
      }
    }

    function bytesToBase64(bytes) {
      let binary = "";
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
      }
      return btoa(binary);
    }

    function canvasToJpegWithDpi(canvas, dpi, quality) {
      const dataUrl = canvas.toDataURL("image/jpeg", quality);
      const base64 = dataUrl.split(",")[1];
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      setJpegDpi(bytes, dpi);
      return `data:image/jpeg;base64,${bytesToBase64(bytes)}`;
    }

    function downloadDataUrl(url, filename) {
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
    }

    function clearShutterHoldTimer() {
      if (shutterHoldTimer) {
        clearTimeout(shutterHoldTimer);
        shutterHoldTimer = null;
      }
    }

    function finishShutterPress(pointerId) {
      clearShutterHoldTimer();

      if (pointerId != null && btnCapture.hasPointerCapture(pointerId)) {
        btnCapture.releasePointerCapture(pointerId);
      }

      if (shutterHoldActive || isRecordingGif) {
        shutterHoldActive = false;
        if (isRecordingGif) {
          playClick();
          stopRecordingGif(true);
        }
        return;
      }

      if (btnCapture.disabled) return;

      playClick();
      takePhoto();
    }

    let audioCtx = null;

    function ensureAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playClick() {
      const ctx = ensureAudio();
      const t = ctx.currentTime;
      const len = Math.floor(ctx.sampleRate * 0.045);
      const buffer = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = buffer.getChannelData(0);

      for (let i = 0; i < len; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);
      }

      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.value = 1400;
      filter.Q.value = 0.8;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.22, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.045);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      noise.start(t);
      noise.stop(t + 0.05);
    }

    function playTap() {
      const ctx = ensureAudio();
      const t = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(960, t);
      osc.frequency.exponentialRampToValueAtTime(520, t + 0.028);
      gain.gain.setValueAtTime(0.07, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.035);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.04);
    }

    document.addEventListener("pointerdown", () => ensureAudio(), { once: true });

    viewfinder.addEventListener("pointerdown", (e) => {
      if (viewfinder.classList.contains("captured")) return;
      if (e.target.closest(".viewfinder-label")) return;
      focusAtPoint(e.clientX, e.clientY);
    });

    window.addEventListener("orientationchange", updateOrientationUI);
    screen.orientation?.addEventListener("change", updateOrientationUI);
    window.addEventListener("resize", updateOrientationUI);
    updateOrientationUI();

    filterBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        if (btn.disabled) return;
        playTap();
        setFilter(btn.dataset.filter);
      });
    });

    btnCapture.addEventListener("pointerdown", (e) => {
      if (btnCapture.disabled || isRecordingGif) return;
      e.preventDefault();
      btnCapture.setPointerCapture(e.pointerId);
      shutterHoldActive = false;
      clearShutterHoldTimer();
      shutterHoldTimer = setTimeout(() => {
        shutterHoldTimer = null;
        shutterHoldActive = true;
        playClick();
        startRecordingGif();
      }, HOLD_TO_GIF_MS);
    });

    btnCapture.addEventListener("pointerup", (e) => {
      finishShutterPress(e.pointerId);
    });

    btnCapture.addEventListener("pointercancel", (e) => {
      finishShutterPress(e.pointerId);
    });

    btnRetake.addEventListener("click", () => {
      if (btnRetake.disabled) return;
      playClick();
      retakePhoto();
    });
    btnFlip.addEventListener("click", () => {
      if (btnFlip.disabled) return;
      playClick();
      flipCamera();
    });
    btnSave.addEventListener("click", () => {
      if (btnSave.disabled) return;
      playClick();
      savePhoto();
    });

    syncCameraPermission();
    startCamera();
  </script>

</body>
</html>
